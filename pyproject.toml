[project]
name = "x-bookmark-digest"
version = "0.1.0"
description = "Xのブックマークとテック系トレンドを毎朝集め、Jevで振り分けて、Claudeのルーチンが要約する"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "defusedxml>=0.7",
    "httpx>=0.28",
    "trafilatura>=2.0",
    "typesafe-sdk>=0.7",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.11"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
