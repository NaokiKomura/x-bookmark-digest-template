[project]
name = "x-bookmark-digest"
version = "0.1.0"
description = "Xのブックマークとテック系トレンドを毎朝集め、Jevで振り分けて、Claudeのルーチンが要約する"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "defusedxml>=0.7",
    "httpx>=0.28",
    "trafilatura>=2.0",
    "typesafe-sdk>=0.7",
]

[dependency-groups]
dev = ["mypy>=1.15", "pytest>=8.0", "ruff>=0.11", "types-defusedxml>=0.7"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
files = ["scripts", ".claude/hooks"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["trafilatura", "trafilatura.*"]
ignore_missing_imports = true
